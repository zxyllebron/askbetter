name: Platform builds and checks
on:
  push:
    branches: [main, 'codex/cross-platform']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    if: ${{ github.ref != 'refs/heads/codex/cross-platform' || !contains(github.event.head_commit.message, '[linux-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shared backend and draft guards
        run: python3 -m unittest discover -s tests/portable -p 'test_*.py' -v
      - name: Build Ubuntu package
        run: python3 scripts/package_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: AskBetter-Ubuntu-24.04-GNOME
          path: artifacts/linux/*.tar.gz
  macos:
    if: ${{ github.ref != 'refs/heads/codex/cross-platform' || !contains(github.event.head_commit.message, '[linux-only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared backend checks
        run: python3 -m unittest discover -s tests/portable -p 'test_*.py' -v
      - name: Native geometry checks
        run: |
          mkdir -p artifacts/tests
          swiftc macos/Geometry.swift tests/portable/NativeGeometry.swift -o artifacts/tests/mac-geometry
          artifacts/tests/mac-geometry
      - name: Install build dependency
        run: python3 -m pip install 'pyinstaller==6.16.0'
      - name: Build app and bundled runtime
        run: bash macos/build.sh
      - name: Verify bundle and startup diagnostic
        run: |
          codesign --verify --deep --strict artifacts/macos/AskBetter.app
          artifacts/macos/AskBetter.app/Contents/MacOS/AskBetter --diagnose | tee artifacts/tests/macos-diagnostic.json
          python3 tests/portable/bundled_helper.py artifacts/macos/AskBetter.app
          artifacts/macos/AskBetter.app/Contents/MacOS/AskBetter --ui-smoke artifacts/tests
          python3 tests/macos/desktop_check.py artifacts/macos/AskBetter.app
      - uses: actions/upload-artifact@v4
        with:
          name: AskBetter-${{ matrix.runner }}
          path: artifacts/macos/AskBetter-macOS-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.runner }}-reports
          path: artifacts/tests/
  linux-desktop:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
        fixture: [gtk, electron]
        include:
          - session: wayland
            fixture: electron-xwayland
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gnome-shell-extension-prefs gjs xvfb xauth dbus-x11 python3-gi python3-pyatspi python3-dbus gir1.2-gtk-3.0 libglib2.0-bin
      - name: Install browser-backed fixture dependency
        if: startsWith(matrix.fixture, 'electron')
        run: |
          npm install --prefix artifacts/electron --no-save electron@44.7.0
          artifacts/electron/node_modules/.bin/install-electron
          sudo chown root:root artifacts/electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 artifacts/electron/node_modules/electron/dist/chrome-sandbox
      - name: GNOME circular button and real AT-SPI editor checks
        env:
          ASKBETTER_FIXTURE: ${{ matrix.fixture }}
        run: xvfb-run -a -s '-screen 0 1280x900x24' bash tests/linux/run_session.sh '${{ matrix.session }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-desktop-${{ matrix.session }}-${{ matrix.fixture }}-reports
          path: artifacts/tests/
  windows:
    if: ${{ github.ref != 'refs/heads/codex/cross-platform' || !contains(github.event.head_commit.message, '[linux-only]') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Existing Windows checks
        shell: powershell
        run: .\scripts\test.ps1
      - name: Package Windows app
        shell: powershell
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AskBetter-Windows
          path: artifacts/releases/AskBetter-Windows.zip
